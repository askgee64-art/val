name: VAL Core Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit, Integration & Security Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "greenlet>=3.1.0" pytest pytest-asyncio httpx

      - name: Run Test Suite
        env:
          VAL_ENV: testing
          VAL_DEBUG: "true"
          VAL_DATABASE_URL: "sqlite+aiosqlite:///data/test_ci.db"
        run: |
          PYTHONPATH=backend pytest tests -v --durations=10

      - name: Verify Hardware Probe
        run: |
          python scripts/run_diagnostics.py
